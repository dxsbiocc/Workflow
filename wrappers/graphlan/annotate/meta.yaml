name: graphlan
description: |
  GraPhlAn is a software tool for producing high-quality circular representations of 
  taxonomic and phylogenetic trees. GraPhlAn focuses on concise, integrative, 
  informative, and publication-ready representations of phylogenetically- and 
  taxonomically-driven investigation.
url: https://github.com/biobakery/graphlan
authors:
  - dengxsh
input:
  - taxonomy file
  - abundance file
output:
  - graphlan file
notes: |
  * The `command` param allows to specify how to do with the GFA: `view` [default], `stat`, `gfa2fa`, `gfa2bed`, `blacklist`, `bubble`, `asm`, `sql`, or `version`.
